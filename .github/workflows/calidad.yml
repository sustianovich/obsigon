name: Calidad

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Calidad (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Verificar módulos descargados
        run: go mod verify
      - name: Verificar go.mod y go.sum
        run: go mod tidy -diff
      - name: Comprobar formato
        shell: pwsh
        run: |
          $files = @(gofmt -l .)
          if ($files.Count -ne 0) {
            $files | ForEach-Object { Write-Error "Falta gofmt: $_" }
            exit 1
          }
      - name: Análisis estático
        run: go vet ./...
      - name: Vulnerabilidades conocidas
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.23.x"
          go-package: ./...
      - name: Pruebas Go
        run: go test ./...
      - name: Instalar dependencias del frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis del frontend
        run: npm run check
      - name: Pruebas del frontend
        run: npm test
      - name: Compilar todo sin CGO
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Verificar la UI empotrada desde el binario
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { ".exe" } else { "" }
          $binary = Join-Path $env:RUNNER_TEMP "obsigon-ci$extension"
          $vault = Join-Path $env:RUNNER_TEMP "obsigon-vault"
          $database = Join-Path $env:RUNNER_TEMP "obsigon-index.sqlite3"
          New-Item -ItemType Directory -Force -Path $vault | Out-Null

          $tcp = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $tcp.Start()
          $port = ([Net.IPEndPoint]$tcp.LocalEndpoint).Port
          $tcp.Stop()

          $env:CGO_ENABLED = "0"
          $env:APP_HOST = "127.0.0.1"
          $env:APP_PORT = "$port"
          $env:OBSIDIAN_VAULT_PATH = $vault
          $env:RAG_DATABASE_PATH = $database
          go build -trimpath -o $binary ./cmd/server

          $stderr = Join-Path $env:RUNNER_TEMP "obsigon-stderr.log"
          $server = Start-Process -FilePath $binary -PassThru -RedirectStandardError $stderr
          try {
            $baseUrl = "http://127.0.0.1:$port"
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($server.HasExited) { break }
              try {
                Invoke-WebRequest -UseBasicParsing "$baseUrl/health" -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              Get-Content -ErrorAction SilentlyContinue $stderr
              throw "El binario no llegó a estar disponible."
            }
            $homeResponse = Invoke-WebRequest -UseBasicParsing "$baseUrl/"
            $styles = Invoke-WebRequest -UseBasicParsing "$baseUrl/static/styles.css"
            if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Headers."Content-Type" -notlike "text/html*") { throw "HTML empotrado inválido." }
            $modules = @("app", "api", "chat", "context-inspector", "projects", "retrieval-trace", "sources", "sse", "state")
            foreach ($module in $modules) {
              $script = Invoke-WebRequest -UseBasicParsing "$baseUrl/static/$module.js"
              if ($script.StatusCode -ne 200 -or $script.Headers."Content-Type" -notlike "*javascript*") { throw "Módulo JavaScript empotrado inválido: $module.js" }
            }
            if ($styles.StatusCode -ne 200 -or $styles.Headers."Content-Type" -notlike "text/css*") { throw "CSS empotrado inválido." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  race:
    name: Detector de carreras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - name: Pruebas con race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  recuperacion:
    name: Puerta de calidad de recuperación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - name: Comprobar métricas con fixtures deterministas
        env:
          CGO_ENABLED: "0"
          OLLAMA_CHAT_MODEL: gpt-oss:latest
          OLLAMA_EMBEDDING_MODEL: nomic-embed-text
        run: go run ./cmd/evaluate -vault ./vault_ci -dataset ./evaluations/ci_questions.json -fixtures ./evaluations/fixtures/ci_questions.json -check
